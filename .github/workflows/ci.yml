name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x mvnw
        working-directory: booking-service

      - name: Run tests
        run: ./mvnw verify
        working-directory: booking-service
